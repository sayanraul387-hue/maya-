<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Mystery Challenge</title>

 <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <div class="brand">🧩 Mystery Challenge - Admin</div>

    <button id="logoutBtn" class="logout-btn">
      Logout
    </button>
  </nav>

  <main class="admin-container">

    <h1>Admin Dashboard</h1>

    <p class="admin-subtitle">
      Registered Users
    </p>
<div class="admin-stats">
  <div class="stat-card">
    <div class="stat-icon">👥</div>
    <div>
      <p>Total Users</p>
      <h2 id="totalUsers">0</h2>
    </div>
  </div>
</div>
    <div id="message">
      Loading users...
    </div>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Registered</th>
          </tr>
        </thead>

        <tbody id="usersTable">
        </tbody>

      </table>

    </div>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
